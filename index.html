<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UDID Device</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --white: #ffffff;
            --snow: #f5f8ff;
            --ice: #e8f0ff;
            --accent: #3c7acd;
            --accent-rgb: 60, 122, 205;
            --accent-light: #6ba3e8;
            --accent-soft: #a8c8f5;
            --accent-deep: #2f63ad;
            --blue-muted: #8eb4e8;
            --blue-light: var(--accent-soft);
            --blue: var(--accent);
            --blue-deep: var(--accent-deep);
            --blue-dark: #285a9e;
            --navy: #152638;
            --slate: #5a7394;
            --ring: rgba(var(--accent-rgb), 0.18);
            --text-on-dark: #f0f5fc;
            --text-on-dark-muted: rgba(226, 235, 250, 0.76);
            --panel-glass: rgba(255, 255, 255, 0.07);
            --panel-border: rgba(255, 255, 255, 0.14);
            --glow-blue: rgba(var(--accent-rgb), 0.38);
            --glow-blue-soft: rgba(var(--accent-rgb), 0.2);
            /* Фон: мягкие «ореолы» + база чуть светлее (mini app) */
            --scene-bg:
                radial-gradient(ellipse 92% 58% at 50% 108%, rgba(var(--accent-rgb), 0.26) 0%, transparent 58%),
                radial-gradient(ellipse 78% 48% at 50% -12%, rgba(130, 175, 235, 0.22) 0%, transparent 54%),
                radial-gradient(ellipse 52% 42% at 96% 48%, rgba(var(--accent-rgb), 0.14) 0%, transparent 48%),
                radial-gradient(ellipse 48% 38% at 4% 52%, rgba(160, 200, 250, 0.12) 0%, transparent 46%),
                linear-gradient(195deg, #1a2d44 0%, #152538 38%, #121f32 100%);
        }

        body {
            font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: rgba(226, 232, 255, 0.92);
            position: relative;
            overflow: hidden;
            background: var(--scene-bg);
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: "";
            position: fixed;
            inset: -20%;
            background:
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 28px 28px;
            opacity: 0.35;
            transform: perspective(500px) rotateX(36deg) translateY(8%);
            animation: gridPulse 12s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 120% 85% at 50% 35%, rgba(var(--accent-rgb), 0.14) 0%, transparent 55%),
                radial-gradient(circle at 50% 100%, rgba(var(--accent-rgb), 0.08) 0%, transparent 45%),
                radial-gradient(circle at center, transparent 22%, rgba(8, 14, 24, 0.35) 100%);
            pointer-events: none;
            z-index: 0;
        }

        .app-content {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1), transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
            z-index: 1;
        }

        .app-content.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Интро: только лоадер поверх того же фона, что и у body */
        .splash {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            animation: splashFadeOut 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            animation-delay: 3.12s;
        }

        /* Крупнее на телефоне, но с потолком — не упирается в края */
        .loader-mark {
            position: relative;
            width: clamp(104px, 33vmin, 132px);
            height: clamp(104px, 33vmin, 132px);
            z-index: 2;
        }

        .loader-corners {
            position: absolute;
            inset: 0;
            animation: cornersMorph 2.75s cubic-bezier(0.34, 0.02, 0.18, 1) forwards;
        }

        .loader-corners span {
            position: absolute;
            width: 23%;
            height: 23%;
            max-width: 28px;
            max-height: 28px;
            border: 3px solid rgba(232, 241, 255, 0.92);
            opacity: 0.94;
            box-sizing: border-box;
        }

        .loader-corners span:nth-child(1) {
            left: 7.5%;
            top: 7.5%;
            border-right: 0;
            border-bottom: 0;
            border-radius: 18px 0 0 0;
        }

        .loader-corners span:nth-child(2) {
            right: 7.5%;
            top: 7.5%;
            border-left: 0;
            border-bottom: 0;
            border-radius: 0 18px 0 0;
        }

        .loader-corners span:nth-child(3) {
            left: 7.5%;
            bottom: 7.5%;
            border-right: 0;
            border-top: 0;
            border-radius: 0 0 0 18px;
        }

        .loader-corners span:nth-child(4) {
            right: 7.5%;
            bottom: 7.5%;
            border-left: 0;
            border-top: 0;
            border-radius: 0 0 18px 0;
        }

        .loader-core {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            isolation: isolate;
        }

        /* Кольцо снизу по слою — не перекрывает логотип «сверху»; схлопывание читается как один жест */
        .loader-ring {
            position: absolute;
            width: 69%;
            height: 69%;
            max-width: 86px;
            max-height: 86px;
            border-radius: 50%;
            border: 2px solid rgba(235, 243, 255, 0.88);
            opacity: 0;
            transform: scale(0.72);
            box-shadow:
                0 0 22px rgba(var(--accent-rgb), 0.38),
                inset 0 0 12px rgba(255, 255, 255, 0.06);
            animation: ringMorph 2.75s cubic-bezier(0.38, 0, 0.15, 1) forwards;
            z-index: 1;
        }

        .loader-logo {
            position: relative;
            width: 64%;
            height: 64%;
            max-width: 78px;
            max-height: 78px;
            object-fit: contain;
            filter: drop-shadow(0 0 12px rgba(var(--accent-rgb), 0.45));
            animation: logoMorphUnified 2.75s cubic-bezier(0.34, 0.02, 0.18, 1) forwards;
            z-index: 2;
        }

        .loader-check {
            position: absolute;
            width: 31%;
            height: 31%;
            max-width: 38px;
            max-height: 38px;
            opacity: 0;
            transform: scale(0.86);
            animation: checkMorph 2.75s cubic-bezier(0.38, 0, 0.15, 1) forwards;
            z-index: 3;
        }

        .loader-check path {
            fill: none;
            stroke: rgba(248, 250, 255, 0.96);
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 26;
            stroke-dashoffset: 26;
            animation: checkDrawUnified 2.75s cubic-bezier(0.33, 1, 0.68, 1) forwards;
        }

        /* Рамка + лого схлопываются к центру (один темп), без «ухода под» кольцо; затем кольцо и галочка */
        @keyframes cornersMorph {
            0% {
                opacity: 1;
                transform: scale(0.94) rotate(0deg);
            }
            7% {
                opacity: 1;
                transform: scale(1.07) rotate(0deg);
            }
            15% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
            40% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
            56% {
                opacity: 1;
                transform: scale(0.62) rotate(2.5deg);
            }
            68% {
                opacity: 0.45;
                transform: scale(0.48) rotate(4deg);
            }
            78%,
            100% {
                opacity: 0;
                transform: scale(0.42) rotate(5deg);
            }
        }

        @keyframes logoMorphUnified {
            0% {
                opacity: 1;
                transform: scale(0.97);
                filter: blur(0) drop-shadow(0 0 14px rgba(var(--accent-rgb), 0.42));
            }
            10% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0) drop-shadow(0 0 12px rgba(var(--accent-rgb), 0.36));
            }
            40% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0) drop-shadow(0 0 10px rgba(var(--accent-rgb), 0.3));
            }
            56% {
                opacity: 1;
                transform: scale(0.62);
                filter: blur(0) drop-shadow(0 0 8px rgba(var(--accent-rgb), 0.22));
            }
            66% {
                opacity: 0.35;
                transform: scale(0.48);
                filter: blur(0.5px) drop-shadow(0 0 4px rgba(var(--accent-rgb), 0.12));
            }
            76%,
            100% {
                opacity: 0;
                transform: scale(0.4);
                filter: blur(0) drop-shadow(0 0 0 transparent);
            }
        }

        @keyframes ringMorph {
            0%,
            34% {
                opacity: 0;
                transform: scale(0.74);
            }
            42% {
                opacity: 0.35;
                transform: scale(0.88);
            }
            50% {
                opacity: 0.82;
                transform: scale(0.98);
            }
            58% {
                opacity: 1;
                transform: scale(1.04);
            }
            68%,
            100% {
                opacity: 0.97;
                transform: scale(1);
            }
        }

        @keyframes checkMorph {
            0%,
            52% {
                opacity: 0;
                transform: scale(0.84);
            }
            60% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes checkDrawUnified {
            0%,
            54% {
                stroke-dashoffset: 26;
            }
            100% {
                stroke-dashoffset: 0;
            }
        }

        @keyframes gridPulse {
            0% {
                opacity: 0.12;
                transform: perspective(500px) rotateX(36deg) translateY(10%) scale(1.03);
            }
            60% {
                opacity: 0.22;
                transform: perspective(500px) rotateX(36deg) translateY(7%) scale(1);
            }
            100% {
                opacity: 0.16;
                transform: perspective(500px) rotateX(36deg) translateY(6%) scale(0.995);
            }
        }

        @keyframes splashFadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        .container {
            width: 100%;
            max-width: 392px;
            background: linear-gradient(168deg, #1a2a3e 0%, #152535 42%, #121f2e 100%);
            border-radius: 28px;
            padding: 28px 22px 22px;
            border: 1px solid rgba(var(--accent-rgb), 0.22);
            box-shadow:
                0 0 0 1px rgba(0, 0, 0, 0.28) inset,
                0 8px 28px rgba(0, 0, 0, 0.32),
                0 24px 48px -14px rgba(var(--accent-rgb), 0.2);
            position: relative;
            overflow: hidden;
            animation: cardEnter 0.75s cubic-bezier(0.22, 1, 0.36, 1) both;
            z-index: 1;
        }

        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent);
        }

        .glow {
            position: absolute;
            width: 260px;
            height: 260px;
            background: radial-gradient(
                circle,
                rgba(var(--accent-rgb), 0.22) 0%,
                rgba(var(--accent-rgb), 0.07) 45%,
                transparent 70%
            );
            border-radius: 50%;
            top: -140px;
            right: -110px;
            animation: pulse 6s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes cardEnter {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.55;
            }
            50% {
                transform: scale(1.08);
                opacity: 0.85;
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes floatIcon {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-3px);
            }
        }

        .header {
            text-align: center;
            position: relative;
            z-index: 1;
            animation: fadeUp 0.65s ease both;
            animation-delay: 0.12s;
        }

        .icon-wrap {
            width: 76px;
            height: 76px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 22px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(var(--accent-rgb), 0.28);
            box-shadow:
                0 8px 24px rgba(0, 0, 0, 0.22),
                0 0 0 1px rgba(255, 255, 255, 0.06) inset,
                0 0 24px -6px rgba(var(--accent-rgb), 0.35);
            animation: floatIcon 4s ease-in-out infinite;
        }

        .icon-wrap img {
            width: 44px;
            height: 44px;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.25));
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-on-dark);
            letter-spacing: -0.03em;
            line-height: 1.2;
            margin-bottom: 10px;
        }

        .desc {
            font-size: 0.9375rem;
            font-weight: 500;
            color: var(--text-on-dark-muted);
            line-height: 1.55;
            max-width: 300px;
            margin: 0 auto;
        }

        .action-panel {
            margin-top: 22px;
            padding: 0;
            background: transparent;
            border: none;
            box-shadow: none;
            animation: fadeUp 0.65s ease both;
            animation-delay: 0.22s;
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 12px 28px rgba(var(--accent-rgb), 0.22));
        }

        /* Обводка «скользит» по периметру (conic-gradient + вращение) */
        .btn-primary-shell {
            position: relative;
            border-radius: 22px;
            padding: 2.5px;
            overflow: hidden;
        }

        .btn-primary-border {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 220%;
            height: 220%;
            transform: translate(-50%, -50%);
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                transparent 198deg,
                rgba(var(--accent-rgb), 0.1) 218deg,
                rgba(var(--accent-rgb), 0.55) 246deg,
                rgba(130, 175, 235, 0.82) 266deg,
                rgba(var(--accent-rgb), 0.5) 286deg,
                rgba(var(--accent-rgb), 0.14) 310deg,
                transparent 338deg,
                transparent 360deg
            );
            animation: btnBorderSpin 5.8s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes btnBorderSpin {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        .btn-primary {
            width: 100%;
            min-height: 76px;
            padding: 15px 17px;
            background: linear-gradient(
                172deg,
                rgba(var(--accent-rgb), 0.16) 0%,
                #1a2838 28%,
                #141f2d 55%,
                #101a26 100%
            );
            color: var(--white);
            border: none;
            border-radius: 19px;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            position: relative;
            z-index: 1;
            overflow: hidden;
            box-shadow:
                0 0 0 1px rgba(var(--accent-rgb), 0.35) inset,
                0 1px 0 rgba(255, 255, 255, 0.1) inset,
                0 12px 36px rgba(0, 0, 0, 0.38),
                0 0 40px -12px rgba(var(--accent-rgb), 0.45);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow:
                0 0 0 1px rgba(var(--accent-rgb), 0.45) inset,
                0 1px 0 rgba(255, 255, 255, 0.12) inset,
                0 16px 40px rgba(0, 0, 0, 0.42),
                0 0 48px -8px rgba(var(--accent-rgb), 0.55);
        }

        .btn-primary:active {
            transform: scale(0.98);
            box-shadow:
                0 0 0 1px rgba(0, 0, 0, 0.45) inset,
                0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .btn-primary:focus-visible {
            outline: 2px solid var(--accent-light);
            outline-offset: 3px;
        }

        .btn-primary__icon {
            flex-shrink: 0;
            width: 50px;
            height: 50px;
            border-radius: 15px;
            background: rgba(var(--accent-rgb), 0.22);
            border: 1px solid rgba(var(--accent-rgb), 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary__icon svg {
            width: 26px;
            height: 26px;
            fill: none;
            stroke: var(--accent-soft);
            stroke-width: 1.65;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn-primary__copy {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            text-align: left;
        }

        .btn-primary__title {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #f8fafc;
            line-height: 1.2;
        }

        .btn-primary__sub {
            font-size: 0.75rem;
            font-weight: 500;
            color: rgba(200, 220, 245, 0.82);
            line-height: 1.35;
        }

        .btn-primary__pip {
            flex-shrink: 0;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, var(--accent-light), var(--accent-deep));
            box-shadow:
                0 0 10px rgba(var(--accent-rgb), 0.65),
                inset 0 1px 2px rgba(255, 255, 255, 0.35);
            opacity: 1;
        }

        .ripple {
            position: absolute;
            background: rgba(var(--accent-rgb), 0.32);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple 0.55s ease-out;
            pointer-events: none;
        }

        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        .hint-box {
            margin-top: 18px;
            padding: 0;
            background: rgba(22, 34, 52, 0.72);
            border-radius: 18px;
            border: 1px solid rgba(var(--accent-rgb), 0.2);
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.18) inset;
            animation: fadeUp 0.65s ease both;
            animation-delay: 0.28s;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .hint-toggle {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 16px 17px;
            margin: 0;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 0.8125rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.055em;
            color: var(--accent-soft);
            cursor: pointer;
            text-align: left;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .hint-toggle:hover {
            background: rgba(var(--accent-rgb), 0.08);
        }

        .hint-toggle:active {
            background: rgba(var(--accent-rgb), 0.12);
        }

        .hint-toggle:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: -2px;
        }

        .hint-toggle__chev {
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            border-radius: 8px;
            background: rgba(var(--accent-rgb), 0.18);
            border: 1px solid rgba(var(--accent-rgb), 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .hint-toggle__chev svg {
            width: 12px;
            height: 12px;
            stroke: var(--accent-soft);
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .hint-box.is-open .hint-toggle__chev {
            transform: rotate(180deg);
        }

        .hint-panel {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition:
                max-height 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.3s ease;
        }

        .hint-box.is-open .hint-panel {
            max-height: 420px;
            opacity: 1;
        }

        .hint-panel__inner {
            padding: 0 16px 16px;
        }

        .step {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-on-dark-muted);
            line-height: 1.45;
            transition: transform 0.2s ease;
        }

        .step strong {
            color: var(--text-on-dark);
            font-weight: 600;
        }

        .step:last-child {
            margin-bottom: 0;
        }

        .step:hover {
            transform: translateX(3px);
        }

        .step-num {
            width: 24px;
            height: 24px;
            background: linear-gradient(145deg, var(--accent) 0%, var(--accent-deep) 100%);
            color: var(--white);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6875rem;
            font-weight: 700;
            flex-shrink: 0;
            margin-top: 1px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow: 0 2px 12px rgba(var(--accent-rgb), 0.4);
        }

        @media (max-width: 380px) {
            .container {
                border-radius: 24px;
                padding: 24px 18px 18px;
            }

            .icon-wrap {
                width: 70px;
                height: 70px;
                border-radius: 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }

            .app-content {
                opacity: 1;
                transform: none;
            }

            .splash {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="splash" id="splashScreen" aria-hidden="true">
        <div class="loader-mark" aria-hidden="true">
            <div class="loader-corners">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="loader-core">
                <span class="loader-ring"></span>
                <img class="loader-logo" src="img/logo.png" alt="Logo">
                <svg class="loader-check" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 12.6l4.2 4.1L19 7.8"></path>
                </svg>
            </div>
        </div>
    </div>

    <div class="app-content" id="appContent">
    <main class="container">
        <div class="glow"></div>

        <header class="header">
            <div class="icon-wrap">
                <img src="img/icon.png" alt="" width="44" height="44" decoding="async">
            </div>
            <h1>UDID устройства</h1>
            <p class="desc">Нажмите кнопку ниже, чтобы быстро получить профиль и узнать UDID вашего iPhone.</p>
        </header>

        <section class="action-panel" aria-label="Действие">
            <div class="btn-primary-shell">
                <div class="btn-primary-border" aria-hidden="true"></div>
                <a href="#" class="btn-primary" id="actionBtn">
                    <span class="btn-primary__icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <rect x="3" y="4" width="18" height="13" rx="2.2" fill="none"></rect>
                            <path d="M9 20.5h6"></path>
                            <path d="M12 17v3.5"></path>
                            <path d="M12 9v2.2M10.9 10.1h2.2"></path>
                        </svg>
                    </span>
                    <span class="btn-primary__copy">
                        <span class="btn-primary__title">Получить UDID</span>
                        <span class="btn-primary__sub">Ссылка на профиль для Safari</span>
                    </span>
                    <span class="btn-primary__pip" aria-hidden="true"></span>
                </a>
            </div>
        </section>

        <section class="hint-box" id="hintBox" aria-label="Инструкция">
            <button type="button" class="hint-toggle" id="hintToggle" aria-expanded="false" aria-controls="hintPanel">
                <span>Как получить UDID</span>
                <span class="hint-toggle__chev" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></svg>
                </span>
            </button>
            <div class="hint-panel" id="hintPanel" role="region" aria-labelledby="hintToggle" aria-hidden="true">
                <div class="hint-panel__inner">
                    <div class="step">
                        <div class="step-num">1</div>
                        <div>Нажмите <strong>«Получить UDID»</strong>.</div>
                    </div>
                    <div class="step">
                        <div class="step-num">2</div>
                        <div>Откройте «Настройки», выберите «Профиль загружен» и установите профиль.</div>
                    </div>
                    <div class="step">
                        <div class="step-num">3</div>
                        <div>Вернитесь на страницу результата и скопируйте ваш UDID.</div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    </div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg && typeof tg.expand === "function") {
            tg.expand();
        }
        if (tg && typeof tg.setHeaderColor === "function") {
            tg.setHeaderColor("#3c7acd");
        }
        if (tg && typeof tg.setBackgroundColor === "function") {
            tg.setBackgroundColor("#1e3048");
        }

        const user = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;

        function buildUrl() {
            const baseUrl = "https://api.ipalinks.ru/get/udid/7056914024";
            if (user) {
                const userId = user.id;
                const username = user.username || "no_username";
                return `${baseUrl}/${userId}/${username}.mobileconfig`;
            }
            return `${baseUrl}.mobileconfig`;
        }

        const actionBtn = document.getElementById("actionBtn");
        actionBtn.href = buildUrl();
        const splashScreen = document.getElementById("splashScreen");
        const appContent = document.getElementById("appContent");

        if (appContent) {
            setTimeout(function () {
                appContent.classList.add("is-visible");
            }, 3020);
        }

        if (splashScreen) {
            setTimeout(function () {
                splashScreen.remove();
            }, 3720);
        }

        const hintBox = document.getElementById("hintBox");
        const hintToggle = document.getElementById("hintToggle");
        const hintPanel = document.getElementById("hintPanel");

        if (hintToggle && hintPanel && hintBox) {
            hintToggle.addEventListener("click", function () {
                var open = hintBox.classList.toggle("is-open");
                hintToggle.setAttribute("aria-expanded", open ? "true" : "false");
                hintPanel.setAttribute("aria-hidden", open ? "false" : "true");
            });
        }

        actionBtn.addEventListener("click", function (e) {
            e.preventDefault();
            const url = buildUrl();

            var btn = e.currentTarget;
            var rect = btn.getBoundingClientRect();
            var size = Math.max(rect.width, rect.height);
            var x = e.clientX - rect.left - size / 2;
            var y = e.clientY - rect.top - size / 2;
            var ripple = document.createElement("span");
            ripple.classList.add("ripple");
            ripple.style.width = ripple.style.height = size + "px";
            ripple.style.left = x + "px";
            ripple.style.top = y + "px";
            btn.appendChild(ripple);
            setTimeout(function () {
                ripple.remove();
            }, 600);

            if (tg && typeof tg.openLink === "function") {
                tg.openLink(url);
            } else {
                window.open(url, "_blank");
            }
        });
    </script>
</body>
</html>
