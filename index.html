<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UDID Device</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --accent: #387dff;
            --accent-rgb: 56, 125, 255;
            --accent-hover: #5a94ff;
            --accent-press: #2d6ae8;
            --accent-soft: rgba(56, 125, 255, 0.16);
            --icon-frame: #3c7acd;
            --icon-frame-rgb: 60, 122, 205;
            --scene-base: #0c0e12;
            --scene-mid: #10141c;
            --scene-blob: rgba(56, 125, 255, 0.11);
            --scene-blob-2: rgba(56, 125, 255, 0.05);
            --grid-line: rgba(255, 255, 255, 0.04);
            --grid-opacity: 0.35;
            --text: #f2f4f8;
            --text-muted: rgba(226, 232, 245, 0.58);
            --card: #15181f;
            --card-border: rgba(255, 255, 255, 0.06);
            --card-shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 8px 32px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(0, 0, 0, 0.35) inset;
            --card-topbar: #387dff;
            --icon-surface: rgba(255, 255, 255, 0.05);
            --hint-surface: rgba(255, 255, 255, 0.03);
            --hint-border: rgba(255, 255, 255, 0.07);
            --loader-line: rgba(244, 247, 255, 0.92);
            --loader-glow: rgba(56, 125, 255, 0.35);
            --btn-shadow: 0 2px 8px rgba(0, 0, 0, 0.35), 0 12px 36px rgba(56, 125, 255, 0.22);
            --ripple: rgba(255, 255, 255, 0.2);
        }

        body {
            font-family: "DM Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
            font-optical-sizing: auto;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            color: var(--text);
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
            background: var(--scene-base);
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 100% 80% at 50% -20%, var(--scene-blob) 0%, transparent 50%),
                radial-gradient(ellipse 70% 50% at 100% 100%, var(--scene-blob-2) 0%, transparent 45%),
                radial-gradient(ellipse 60% 45% at 0% 80%, var(--scene-blob-2) 0%, transparent 42%),
                linear-gradient(180deg, var(--scene-base) 0%, var(--scene-mid) 100%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: calc(0.12 * var(--grid-opacity, 1));
            mask-image: radial-gradient(ellipse 85% 75% at 50% 40%, black 15%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .app-content {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1), transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
            z-index: 1;
        }

        .app-content.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Интро на том же фоне, что и страница (прозрачный слой только поверх контента) */
        .splash {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            overflow: hidden;
            animation: splashFadeOut 0.36s cubic-bezier(0.45, 0, 0.2, 1) forwards;
            animation-delay: 1.22s;
        }

        /* Интро не стартует с первого кадра: скрипт снимает .splash--hold после готовности Mini App */
        .splash.splash--hold {
            visibility: hidden;
            pointer-events: none;
        }

        .splash.splash--hold,
        .splash.splash--hold * {
            animation: none !important;
        }

        .loader-mark {
            position: relative;
            width: clamp(82px, 26vmin, 112px);
            height: clamp(82px, 26vmin, 112px);
            margin: auto;
            flex-shrink: 0;
            z-index: 2;
        }

        .loader-corners {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        .loader-corners span {
            position: absolute;
            width: 22%;
            height: 22%;
            max-width: 30px;
            max-height: 30px;
            border: 2px solid var(--loader-line);
            opacity: 0.98;
            box-sizing: border-box;
        }

        .loader-corners span:nth-child(1) {
            left: 8%;
            top: 8%;
            border-right: 0;
            border-bottom: 0;
            border-radius: 16px 0 0 0;
            animation: cornerTL 1s cubic-bezier(0.42, 0, 0.58, 1) forwards;
        }

        .loader-corners span:nth-child(2) {
            right: 8%;
            top: 8%;
            border-left: 0;
            border-bottom: 0;
            border-radius: 0 16px 0 0;
            animation: cornerTR 1s cubic-bezier(0.42, 0, 0.58, 1) forwards;
        }

        .loader-corners span:nth-child(3) {
            left: 8%;
            bottom: 8%;
            border-right: 0;
            border-top: 0;
            border-radius: 0 0 0 16px;
            animation: cornerBL 1s cubic-bezier(0.42, 0, 0.58, 1) forwards;
        }

        .loader-corners span:nth-child(4) {
            right: 8%;
            bottom: 8%;
            border-left: 0;
            border-top: 0;
            border-radius: 0 0 16px 0;
            animation: cornerBR 1s cubic-bezier(0.42, 0, 0.58, 1) forwards;
        }

        .loader-core {
            position: absolute;
            inset: 0;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            isolation: isolate;
        }

        .loader-ring {
            position: absolute;
            width: 70%;
            height: 70%;
            max-width: 92px;
            max-height: 92px;
            box-sizing: border-box;
            border: 2px solid var(--loader-line);
            border-radius: 28%;
            background: transparent;
            opacity: 0;
            transform: scale(0.9);
            box-shadow: none;
            filter: none;
            animation: ringMorph 1s cubic-bezier(0.42, 0, 0.58, 1) forwards;
            z-index: 1;
        }

        .loader-logo {
            position: relative;
            width: 62%;
            height: 62%;
            max-width: 80px;
            max-height: 80px;
            object-fit: contain;
            animation: logoMorphUnified 1s cubic-bezier(0.42, 0, 0.58, 1) forwards;
            z-index: 2;
        }

        .loader-check {
            position: absolute;
            width: 38%;
            height: 38%;
            max-width: 50px;
            max-height: 50px;
            opacity: 0;
            transform: scale(0.82);
            filter: none;
            animation: checkMorph 1s cubic-bezier(0.42, 0, 0.58, 1) forwards;
            z-index: 3;
        }

        .loader-check path {
            fill: none;
            stroke: var(--loader-line);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 28;
            stroke-dashoffset: 28;
            filter: none;
            animation: checkDrawUnified 1s cubic-bezier(0.42, 0, 0.58, 1) forwards;
        }

        /* Уход рамки плавно, пока кольцо выходит в круг — к 50% квадрат уже не виден */
        @keyframes cornerTL {
            0%,
            18% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            34% {
                opacity: 1;
                transform: translate(10%, 10%) scale(0.98);
            }
            42% {
                opacity: 1;
                transform: translate(18%, 18%) scale(0.92);
            }
            48% {
                opacity: 0.35;
                transform: translate(24%, 24%) scale(0.86);
            }
            52%,
            100% {
                opacity: 0;
                visibility: hidden;
                transform: translate(24%, 24%) scale(0.86);
            }
        }

        @keyframes cornerTR {
            0%,
            18% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            34% {
                opacity: 1;
                transform: translate(-10%, 10%) scale(0.98);
            }
            42% {
                opacity: 1;
                transform: translate(-18%, 18%) scale(0.92);
            }
            48% {
                opacity: 0.35;
                transform: translate(-24%, 24%) scale(0.86);
            }
            52%,
            100% {
                opacity: 0;
                visibility: hidden;
                transform: translate(-24%, 24%) scale(0.86);
            }
        }

        @keyframes cornerBL {
            0%,
            18% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            34% {
                opacity: 1;
                transform: translate(10%, -10%) scale(0.98);
            }
            42% {
                opacity: 1;
                transform: translate(18%, -18%) scale(0.92);
            }
            48% {
                opacity: 0.35;
                transform: translate(24%, -24%) scale(0.86);
            }
            52%,
            100% {
                opacity: 0;
                visibility: hidden;
                transform: translate(24%, -24%) scale(0.86);
            }
        }

        @keyframes cornerBR {
            0%,
            18% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            34% {
                opacity: 1;
                transform: translate(-10%, -10%) scale(0.98);
            }
            42% {
                opacity: 1;
                transform: translate(-18%, -18%) scale(0.92);
            }
            48% {
                opacity: 0.35;
                transform: translate(-24%, -24%) scale(0.86);
            }
            52%,
            100% {
                opacity: 0;
                visibility: hidden;
                transform: translate(-24%, -24%) scale(0.86);
            }
        }

        /* Свечение только у логотипа (мягкий белый ореол) */
        @keyframes logoMorphUnified {
            0% {
                opacity: 1;
                transform: scale(0.99);
                filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.2));
            }
            12% {
                opacity: 1;
                transform: scale(1);
                filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.26));
            }
            26% {
                opacity: 1;
                transform: scale(1.02);
                filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.38)) drop-shadow(0 0 28px rgba(255, 255, 255, 0.12));
            }
            36% {
                opacity: 1;
                transform: scale(1);
                filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.24));
            }
            44% {
                opacity: 1;
                transform: scale(0.94);
                filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.16));
            }
            54% {
                opacity: 0.45;
                transform: scale(0.72);
                filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.08));
            }
            66%,
            100% {
                opacity: 0;
                transform: scale(0.32);
                filter: none;
            }
        }

        /* Кольцо: только scale + border-radius, синхрон с исчезновением уголков ~44–52% */
        @keyframes ringMorph {
            0%,
            30% {
                opacity: 0;
                transform: scale(0.88);
                border-radius: 30%;
            }
            36% {
                opacity: 0.35;
                transform: scale(0.9);
                border-radius: 29%;
            }
            44% {
                opacity: 1;
                transform: scale(0.94);
                border-radius: 36%;
            }
            50% {
                opacity: 1;
                transform: scale(0.98);
                border-radius: 44%;
            }
            54% {
                opacity: 1;
                transform: scale(1.01);
                border-radius: 50%;
            }
            62%,
            100% {
                opacity: 1;
                transform: scale(1);
                border-radius: 50%;
            }
        }

        @keyframes checkMorph {
            0%,
            56% {
                opacity: 0;
                transform: scale(0.9);
            }
            64% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes checkDrawUnified {
            0%,
            58% {
                stroke-dashoffset: 28;
            }
            100% {
                stroke-dashoffset: 0;
            }
        }

        @keyframes splashFadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        .container {
            width: 100%;
            max-width: 380px;
            background: var(--card);
            border-radius: 24px;
            padding: 28px 22px 22px;
            border: 1px solid var(--card-border);
            box-shadow: var(--card-shadow);
            position: relative;
            overflow: hidden;
            animation: cardEnter 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;
            z-index: 1;
        }

        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--card-topbar);
        }

        @keyframes cardEnter {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.99);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            position: relative;
            z-index: 1;
            animation: fadeUp 0.55s ease both;
            animation-delay: 0.08s;
        }

        .icon-wrap {
            width: 68px;
            height: 68px;
            background: var(--icon-surface);
            border-radius: 20px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid rgba(var(--icon-frame-rgb), 0.25);
            box-shadow:
                0 0 0 1px rgba(0, 0, 0, 0.35) inset,
                0 0 22px -2px rgba(var(--icon-frame-rgb), 0.11);
            animation: fadeUp 0.55s ease both;
            animation-delay: 0.04s;
        }

        .icon-wrap img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            display: block;
        }

        h1 {
            font-size: 1.375rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.04em;
            line-height: 1.15;
            margin-bottom: 8px;
        }

        .desc {
            font-size: 0.9375rem;
            font-weight: 500;
            color: var(--text-muted);
            line-height: 1.5;
            max-width: 300px;
            margin: 0 auto;
        }

        .action-panel {
            margin-top: 24px;
            animation: fadeUp 0.55s ease both;
            animation-delay: 0.14s;
            position: relative;
            z-index: 1;
        }

        .btn-primary {
            width: 100%;
            min-height: 56px;
            padding: 14px 16px 14px 14px;
            background: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 14px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            box-shadow: var(--btn-shadow);
            transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .btn-primary::after {
            content: "";
            position: absolute;
            inset: 0;
            left: -35%;
            width: 45%;
            background: linear-gradient(
                100deg,
                transparent 0%,
                rgba(255, 255, 255, 0) 38%,
                rgba(255, 255, 255, 0.22) 50%,
                rgba(255, 255, 255, 0) 62%,
                transparent 100%
            );
            transform: skewX(-16deg) translateX(-120%);
            animation: btnSheen 8.5s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes btnSheen {
            0%,
            68% {
                transform: skewX(-16deg) translateX(-130%);
                opacity: 0;
            }
            70% {
                opacity: 1;
            }
            88% {
                transform: skewX(-16deg) translateX(300%);
                opacity: 0.35;
            }
            93%,
            100% {
                transform: skewX(-16deg) translateX(300%);
                opacity: 0;
            }
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-primary:active {
            transform: scale(0.98);
            background: var(--accent-press);
        }

        .btn-primary:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.75);
            outline-offset: 2px;
        }

        .btn-primary__icons {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        .btn-primary__icon-pad {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 13px;
            background: rgba(255, 255, 255, 0.12);
            border: none;
            box-shadow: none;
        }

        .btn-primary__icons svg {
            width: 25px;
            height: 25px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.55;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn-primary__icons .btn-ic-plus {
            stroke: rgba(200, 220, 255, 0.98);
        }

        .btn-primary__icons .btn-ic-frame {
            stroke: rgba(255, 255, 255, 0.95);
        }

        .btn-primary__label {
            flex: 1;
            min-width: 0;
            text-align: left;
            position: relative;
            z-index: 2;
            line-height: 1.25;
        }

        .btn-primary__sub {
            display: block;
            margin-top: 3px;
            font-size: 0.8125rem;
            font-weight: 500;
            opacity: 0.9;
            letter-spacing: 0.01em;
            line-height: 1.35;
        }

        .ripple {
            position: absolute;
            background: var(--ripple);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple 0.55s ease-out;
            pointer-events: none;
        }

        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        .hint-box {
            margin-top: 14px;
            padding: 0;
            background: var(--hint-surface);
            border-radius: 16px;
            border: 1px solid var(--hint-border);
            animation: fadeUp 0.55s ease both;
            animation-delay: 0.2s;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .hint-toggle {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 16px;
            margin: 0;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text);
            cursor: pointer;
            text-align: left;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            transition: background 0.2s ease;
        }

        .hint-toggle:hover {
            background: var(--accent-soft);
        }

        .hint-toggle:active {
            background: var(--accent-soft);
        }

        .hint-toggle:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: -2px;
        }

        .hint-toggle__chev {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            border-radius: 10px;
            background: var(--accent-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .hint-toggle__chev svg {
            width: 14px;
            height: 14px;
            stroke: var(--accent);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .hint-box.is-open .hint-toggle__chev {
            transform: rotate(180deg);
        }

        .hint-panel {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition:
                max-height 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.28s ease;
        }

        .hint-box.is-open .hint-panel {
            max-height: 420px;
            opacity: 1;
        }

        .hint-panel__inner {
            padding: 0 16px 16px;
        }

        .step {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
            line-height: 1.45;
        }

        .step strong {
            color: var(--text);
            font-weight: 600;
        }

        .step:last-child {
            margin-bottom: 0;
        }

        .step-num {
            width: 22px;
            height: 22px;
            background: var(--accent);
            color: #fff;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6875rem;
            font-weight: 700;
            flex-shrink: 0;
            margin-top: 1px;
        }

        @media (max-width: 380px) {
            .container {
                border-radius: 20px;
                padding: 24px 18px 18px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }

            .app-content {
                opacity: 1;
                transform: none;
            }

            .splash {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="splash splash--hold" id="splashScreen" aria-hidden="true">
        <div class="loader-mark" aria-hidden="true">
            <div class="loader-corners">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="loader-core">
                <span class="loader-ring"></span>
                <img class="loader-logo" src="img/logo.png" alt="">
                <svg class="loader-check" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 12.6l4.2 4.1L19 7.8"></path>
                </svg>
            </div>
        </div>
    </div>

    <div class="app-content" id="appContent">
        <main class="container">
            <header class="header">
                <div class="icon-wrap">
                    <img src="img/icon.png" alt="" width="40" height="40" decoding="async">
                </div>
                <h1>UDID устройства</h1>
                <p class="desc">Профиль для Safari — получите UDID iPhone в пару шагов.</p>
            </header>

            <section class="action-panel" aria-label="Действие">
                <a href="#" class="btn-primary" id="actionBtn">
                    <span class="btn-primary__icons" aria-hidden="true">
                        <span class="btn-primary__icon-pad">
                            <svg viewBox="0 0 24 24">
                                <rect class="btn-ic-frame" x="4" y="5" width="16" height="11" rx="2.5" ry="2.5" fill="none"></rect>
                                <path class="btn-ic-frame" d="M9 18.5h6" fill="none"></path>
                                <path class="btn-ic-plus" d="M12 9v2.8M10.6 10.4h2.8" fill="none"></path>
                            </svg>
                        </span>
                    </span>
                    <span class="btn-primary__label">
                        Получить UDID
                        <span class="btn-primary__sub">Откроется ссылка на профиль</span>
                    </span>
                </a>
            </section>

            <section class="hint-box" id="hintBox" aria-label="Инструкция">
                <button type="button" class="hint-toggle" id="hintToggle" aria-expanded="false" aria-controls="hintPanel">
                    <span>Как получить UDID</span>
                    <span class="hint-toggle__chev" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></svg>
                    </span>
                </button>
                <div class="hint-panel" id="hintPanel" role="region" aria-labelledby="hintToggle" aria-hidden="true">
                    <div class="hint-panel__inner">
                        <div class="step">
                            <div class="step-num">1</div>
                            <div>Нажмите <strong>«Получить UDID»</strong>.</div>
                        </div>
                        <div class="step">
                            <div class="step-num">2</div>
                            <div>В «Настройках» откройте «Профиль загружен» и установите профиль.</div>
                        </div>
                        <div class="step">
                            <div class="step-num">3</div>
                            <div>На странице результата скопируйте UDID.</div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg && typeof tg.expand === "function") {
            tg.expand();
        }

        const user = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;

        function buildUrl() {
            const baseUrl = "https://api.ipalinks.ru/get/udid/7056914024";
            if (user) {
                const userId = user.id;
                const username = user.username || "no_username";
                return `${baseUrl}/${userId}/${username}.mobileconfig`;
            }
            return `${baseUrl}.mobileconfig`;
        }

        const actionBtn = document.getElementById("actionBtn");
        actionBtn.href = buildUrl();
        const splashScreen = document.getElementById("splashScreen");
        const appContent = document.getElementById("appContent");

        function whenMiniAppHostReady(callback) {
            var hasTg = window.Telegram && window.Telegram.WebApp;
            function afterHostPaint() {
                if (hasTg) {
                    requestAnimationFrame(function () {
                        requestAnimationFrame(function () {
                            setTimeout(callback, 150);
                        });
                    });
                } else {
                    requestAnimationFrame(callback);
                }
            }
            if (document.readyState === "complete") {
                afterHostPaint();
            } else {
                window.addEventListener("load", afterHostPaint, { once: true });
            }
        }

        function startSplashIntro() {
            if (splashScreen) {
                splashScreen.classList.remove("splash--hold");
            }
            if (tg && typeof tg.ready === "function") {
                tg.ready();
            }
            if (appContent) {
                setTimeout(function () {
                    appContent.classList.add("is-visible");
                }, 1120);
            }
            if (splashScreen) {
                setTimeout(function () {
                    splashScreen.remove();
                }, 1620);
            }
        }

        whenMiniAppHostReady(startSplashIntro);

        const hintBox = document.getElementById("hintBox");
        const hintToggle = document.getElementById("hintToggle");
        const hintPanel = document.getElementById("hintPanel");

        if (hintToggle && hintPanel && hintBox) {
            hintToggle.addEventListener("click", function () {
                var open = hintBox.classList.toggle("is-open");
                hintToggle.setAttribute("aria-expanded", open ? "true" : "false");
                hintPanel.setAttribute("aria-hidden", open ? "false" : "true");
            });
        }

        actionBtn.addEventListener("click", function (e) {
            e.preventDefault();
            const url = buildUrl();

            var btn = e.currentTarget;
            var rect = btn.getBoundingClientRect();
            var size = Math.max(rect.width, rect.height);
            var x = e.clientX - rect.left - size / 2;
            var y = e.clientY - rect.top - size / 2;
            var ripple = document.createElement("span");
            ripple.classList.add("ripple");
            ripple.style.width = ripple.style.height = size + "px";
            ripple.style.left = x + "px";
            ripple.style.top = y + "px";
            btn.appendChild(ripple);
            setTimeout(function () {
                ripple.remove();
            }, 600);

            if (tg && typeof tg.openLink === "function") {
                tg.openLink(url);
            } else {
                window.open(url, "_blank");
            }
        });
    </script>
</body>
</html>
